<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caiet de practică · XII A</title>
<script>document.write('<script src="config.js?v='+Date.now()+'"><\/script>');</script>
<style>
:root{--ink:#1F2A44;--blue:#1F4E79;--hf:#BDD7EE;--lf:#DDEBF7;--grn:#548235;--rf:#E2EFDA;--rb:#A9D08E;--df:#EAF2FB;--db:#9DC3E6;--muted:#5B667A;--line:#D5DCE6;--bg:#EEF2F7;--ok:#1F8A4C;--ko:#C0392B}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Arial,"Helvetica Neue",Helvetica,sans-serif}
button{font:inherit;cursor:pointer}a{color:var(--blue)}
.small{font-size:13.5px;color:var(--muted)}
/* bara de sus */
#top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;background:var(--blue);color:#fff;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#top .tt{font-weight:700;font-size:15px;line-height:1.2}#top .tt small{display:block;font-weight:400;opacity:.85;font-size:12.5px}
#menuB{display:none;border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:8px;padding:6px 10px;font-size:18px}
.tsp{flex:1}
#prog{width:150px;height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}#prog i{display:block;height:100%;background:#9BE3B4;width:0;transition:width .4s}
#progT{font-size:12.5px;opacity:.9;white-space:nowrap}
#top .tb{border:0;border-radius:8px;padding:7px 12px;font-weight:700;background:rgba(255,255,255,.16);color:#fff}#top .tb.send{background:#FFD84A;color:var(--ink)}
/* structura */
#wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;min-height:calc(100vh - 54px)}
#side{background:#fff;border-right:1px solid var(--line);padding:12px 10px 40px;position:sticky;top:54px;height:calc(100vh - 54px);overflow:auto}
#who{font-weight:700;font-size:14px;margin:2px 6px 2px}#saveSt{font-size:12px;margin:0 6px 10px;color:var(--muted)}#saveSt.ok{color:var(--ok)}#saveSt.ko{color:var(--ko)}
#nav .ng{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 6px 4px;font-weight:700}
#nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 10px;font-size:14.5px;color:var(--ink)}
#nav button small{font-size:11.5px;color:var(--muted);background:#EEF2F7;border-radius:10px;padding:1px 7px}
#nav button:hover{background:#F1F5FA}#nav button.on{background:var(--lf);font-weight:700}
#nav button.done small{background:#D5F0DF;color:var(--ok)}#nav button.part small{background:#FFF1C9;color:#8A6400}
main{padding:20px 22px 80px}
#page{max-width:900px;margin:0 auto}
.ptop{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}.ptop h1{font-size:24px;margin:0;color:var(--blue)}.ptop .pg{width:100%;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ptop .pp{font-size:13.5px;color:var(--muted)}.ptop .ro{font-style:italic}
/* foaia */
.sheet{background:#fff;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 10px 30px -18px rgba(0,0,0,.35);padding:34px 40px 40px}
.dh{text-align:center;font-size:20px;margin:6px 0 14px;color:#000}
.dp{margin:8px 0;text-align:justify}.dp.sm{font-size:13.5px}.dp.ce{text-align:center}.exl{margin-top:4px}
.srcbox{background:#F7FAFD;border-left:4px solid var(--blue);padding:6px 10px;color:var(--blue)!important}
.ret{background:var(--rf);border:1px solid var(--rb);border-radius:2px;padding:10px 14px;margin:10px 0 14px;font-size:15px}.ret .rt{color:var(--grn)}.ret p{margin:3px 0}.ret .fx{font-weight:700;color:var(--blue);padding-left:28px}
.data{background:var(--df);border:1px solid var(--db);padding:8px 16px;margin:8px 0;font-size:16px;white-space:pre-wrap;word-spacing:2px}.data p{margin:2px 0}
.cer{border-left:4px solid var(--blue);padding:4px 12px;margin:8px 0}.cer b{color:var(--blue)}.cer.note{background:#F7FAFD;font-size:14.5px}
.verde{background:var(--rf);border-left:6px solid var(--grn);padding:5px 12px;margin:18px 0 6px}.verde b{color:var(--grn)}.verde span{font-size:13px;color:#4F6228}
.bul{list-style:none;padding:0 0 0 18px;margin:6px 0}.bul li{display:flex;gap:10px;margin:3px 0;text-align:justify}.bul .mk{flex:0 0 auto}.bul.gr{color:var(--grn)}
.exb{position:relative}
.pgbr{border-top:2px dashed #E3E8EF;margin:20px -40px;position:relative}.pgbr::after{content:"pagină nouă";position:absolute;right:46px;top:-10px;background:#fff;color:#B0B9C6;font-size:11px;padding:0 6px}
.sp{height:12px}
/* tabele */
.tbw{overflow-x:auto;margin:8px 0 12px;-webkit-overflow-scrolling:touch}
.dt{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
.dt th{background:var(--hf);border:1px solid #000;padding:6px 6px;font-weight:700;text-align:center;vertical-align:middle;line-height:1.25}
.dt td{border:1px solid #000;padding:5px 6px;vertical-align:middle;line-height:1.3}.dt td.ac{text-align:center}.dt td.lab{background:var(--lf);font-weight:700}
.dt td.hasf{padding:3px}
.kv{min-width:0}
/* câmpuri */
.fi,.fs,.fa{font:inherit;font-size:15px;border:1.5px solid #B8C4D3;border-radius:6px;padding:5px 8px;background:#FFFDF5;color:#0B2A55;max-width:100%}
.fi:focus,.fs:focus,.fa:focus{outline:none;border-color:#2A78D6;box-shadow:0 0 0 3px rgba(42,120,214,.18);background:#fff}
.fn{width:96px;text-align:center}.fn.w-s{width:72px}.ft{width:180px}.ft.w-short{width:120px}.ft.w-mid{width:220px}.ft.w-wide{width:100%;max-width:520px}
td .fi,td .fs{width:100%}td .fn{width:100%}.fi.ac{text-align:center}
textarea.fi{width:100%;resize:vertical;min-height:54px}
.fs{min-height:36px;padding:4px 6px;background-color:#FFFDF5}.fs.inl{width:auto;max-width:100%}
.fa{width:100%;min-height:80px;resize:vertical;line-height:1.45}
.ok{border-color:var(--ok)!important;background:#EAF7EF!important}.ko{border-color:var(--ko)!important;background:#FDECEA!important}
.yn{display:inline-flex;gap:6px;vertical-align:middle}.yn button{border:1.5px solid #B8C4D3;background:#FFFDF5;border-radius:6px;padding:2px 10px;font-size:15px}.yn button.on{background:#E3EEFB;border-color:#2A78D6;font-weight:700}
.yn.ok button.on{background:#EAF7EF;border-color:var(--ok)}.yn.ko button.on{background:#FDECEA;border-color:var(--ko)}
.stw{display:inline-flex;align-items:stretch;gap:0;max-width:100%;width:100%}.stw .fi{border-top-right-radius:0;border-bottom-right-radius:0;flex:1;min-width:0}
.stb{border:1.5px solid #B8C4D3;border-left:0;background:#EEF2F7;border-radius:0 6px 6px 0;padding:0 10px;font-size:15px;color:var(--blue)}
p .stw{width:auto}
.tally{font-family:"Courier New",monospace;font-weight:700;font-size:17px;letter-spacing:1px}.tally .t5{text-decoration:line-through;text-decoration-thickness:2px}
.lines{margin:6px 0 12px}.strt{margin-top:6px}
.ck{border:0;background:none;font-size:22px;line-height:1;padding:2px 8px}.ck.on{color:var(--blue)}
/* ajutoare */
.help{display:flex;gap:10px;background:#FFF8E1;border:1px dashed #E0B100;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px;line-height:1.45;color:#5A4600}.help .hi{font-size:18px}.help code{background:#fff;border-radius:4px;padding:0 4px}
.hint{position:absolute;z-index:70;max-width:min(440px,92vw);background:#1F2A44;color:#fff;border-radius:10px;padding:8px 12px;font-size:13.5px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint .hcalc{border:0;border-radius:6px;background:#FFD84A;color:#1F2A44;font-weight:700;padding:4px 8px;font-size:13px}
.sugm{position:absolute;z-index:75;max-width:min(520px,94vw);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 30px -12px rgba(0,0,0,.4);padding:8px;display:grid;gap:4px}
.sugm p{margin:2px 4px 4px;font-size:12.5px;color:var(--muted)}.sugm button{text-align:left;border:1px solid var(--line);background:#F8FAFC;border-radius:8px;padding:7px 10px;font-size:14px;color:var(--ink)}.sugm button:hover{background:var(--lf)}
.vbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 16px;padding:8px 10px;background:#F4F7FB;border-radius:8px}.vmsg{font-size:14px}.vmsg.ok{color:var(--ok)}.vmsg.ko{color:var(--ko)}
.chkmsg{margin:4px 0;font-size:14px}.chkmsg.ko{color:var(--ko);font-weight:700}
.mine{background:#F4F7FB;border-radius:8px;padding:8px 12px;font-size:14px;margin:6px 0}
/* butoane */
.btn{border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;padding:9px 16px}.btn.sm{padding:6px 12px;font-size:14px}.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}.btn.big{font-size:18px;padding:14px 22px}
.btn:disabled{opacity:.6}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pnav{display:flex;justify-content:space-between;gap:10px;margin:18px 0}
/* imagini */
.shot{border:2px dashed #A6A6A6;border-radius:6px;background:#F7F7F7;padding:14px;margin:10px 0 14px;text-align:center}.shot .ph{color:#7F7F7F;font-style:italic;margin:8px 0 12px}.shot img{max-width:100%;border:1px solid var(--line);border-radius:4px;background:#fff}.shot .row{justify-content:center;margin-top:8px}
/* copertă, săptămână, fișă */
.cover{text-align:center}.peoh{width:100%;max-width:760px;margin-bottom:18px}.cover .cs{font-weight:700;font-size:18px;margin:16px 0 4px}.cover .cs2{font-weight:700;margin:3px 0}
.cover .cm{color:var(--blue);font-weight:700;font-size:23px;margin:36px 0 4px}.cover .cm2{color:var(--blue);font-weight:700;font-size:17px;margin:2px 0}.cover .cm3{color:var(--blue);font-style:italic;margin:2px 0 26px}
.cover .ct{border-top:4px solid var(--blue);border-bottom:4px solid var(--blue);color:var(--blue);font-weight:700;font-size:34px;padding:14px 0;margin:10px 0 30px}
.cover .cp{font-weight:700;line-height:1.8}.cover .ce{margin:8px 0}.cover .ca{font-weight:700;margin-top:24px}.cover .nm .fi{width:min(420px,80vw);text-align:center;font-size:17px}
.week{text-align:center;margin-bottom:14px}.week .wt{border-top:3px solid var(--blue);border-bottom:3px solid var(--blue);color:var(--blue);font-weight:700;font-size:26px;padding:10px 0;margin-bottom:14px}
.week .w1{color:var(--blue);font-weight:700;font-size:17px;margin:4px 0}.week .w2{font-style:italic;margin:6px 0}.week .w3{font-style:italic;color:var(--grn);margin:4px 0}
.fisa .ft{text-align:center;color:var(--blue);font-weight:700;font-size:21px;border-bottom:2px solid var(--blue);padding-bottom:6px;margin-bottom:10px}
/* pagina finală */
.final p{font-size:15.5px}.fbtn{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}.fmsg{font-weight:700}.fmsg.ok{color:var(--ok)}.fmsg.ko{color:var(--ko)}
.okbox{background:#EAF7EF;border:1px solid #BFE0CB;border-radius:8px;padding:8px 12px}
.bk{margin:12px 0;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#FAFBFD}.bk summary{cursor:pointer;font-weight:700}
/* calculator */
#calc{position:fixed;right:16px;bottom:16px;z-index:80;width:320px;max-width:calc(100vw - 24px);background:#fff;border-radius:14px;box-shadow:0 20px 40px -14px rgba(0,0,0,.45);border:1px solid var(--line);padding:12px;display:none}
#calc.on{display:block}#calc h4{margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}#cX{border:0;background:#EEF2F7;border-radius:50%;width:30px;height:30px}
#cIn{width:100%;font:inherit;font-size:18px;padding:8px 10px;border:1.5px solid #B8C4D3;border-radius:8px}#cOut{min-height:30px;font-size:18px;margin:8px 2px}#cOut small{font-size:13px;color:var(--muted)}
.ck2{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ck2 button{border:1px solid var(--line);background:#F4F7FB;border-radius:8px;padding:8px 0;font-size:17px}
/* telefon */
@media (max-width:860px){
 #wrap{display:block}#menuB{display:block}#side{position:fixed;left:0;top:54px;bottom:0;width:84vw;max-width:320px;z-index:50;transform:translateX(-105%);transition:transform .25s;box-shadow:8px 0 30px -10px rgba(0,0,0,.4);height:auto}
 body.navon #side{transform:none}#prog,#progT{display:none}#top .tt small{display:none}#top .tb{padding:6px 9px;font-size:14px}
 main{padding:12px 8px 80px}.sheet{padding:18px 12px 24px}.pgbr{margin:16px -12px}.dt{font-size:13.5px;min-width:480px}.dh{font-size:18px}
 .cover .ct{font-size:26px}.dp,.bul li{text-align:left}.data{font-size:14px;overflow-x:auto;padding:8px 10px}.data p{white-space:pre;word-spacing:0}.week .wt{font-size:21px}.fn{width:84px}.ft{width:100%}
}

/* varianta caietului (PEO / fără PEO) */
.varbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;background:var(--df);border:1px solid var(--db);border-radius:10px;padding:10px 14px;margin:0 0 18px;text-align:left}
.varbar.none{background:#FFF4E5;border-color:#F0B866}
#varM{position:fixed;inset:0;z-index:200;background:rgba(20,30,50,.55);display:none;align-items:center;justify-content:center;padding:16px}
#varM.on{display:flex}
#varM .vbox{background:#fff;color:var(--ink);border-radius:16px;max-width:520px;width:100%;padding:24px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);max-height:calc(100vh - 32px);overflow:auto}
#varM h3{margin:0 0 6px;color:var(--blue);font-size:22px}
#varM p{margin:6px 0 14px}
#varM .vopt{display:block;width:100%;text-align:left;margin:0 0 12px;padding:14px 16px;border-radius:12px;border:2px solid var(--blue);background:#fff;color:var(--blue);font:inherit;cursor:pointer}
#varM .vopt b{display:block;font-size:18px}
#varM .vopt small{display:block;color:var(--muted);margin-top:3px}
#varM .vopt:hover,#varM .vopt.sel{background:var(--blue);color:#fff}
#varM .vopt:hover small,#varM .vopt.sel small{color:#DCE7F3}

</style>
</head>
<body>
<header id="top">
  <button id="menuB" type="button" aria-label="Cuprins">☰</button>
  <div class="tt">Caiet de practică · Modul 6 · XII A<small id="varSub">Stagiu de pregătire practică</small></div>
  <span class="tsp"></span>
  <div id="prog" aria-hidden="true"><i></i></div><span id="progT"></span>
  <button class="tb" id="calcB" type="button" title="Calculator">🧮</button>
  <button class="tb send" id="sendB" type="button">📨 Trimite</button>
</header>
<div id="wrap">
  <aside id="side"><div id="who"></div><div id="saveSt">Răspunsurile se salvează automat pe acest dispozitiv.</div><nav id="nav"></nav></aside>
  <main><div id="page"></div></main>
</div>
<div id="calc" role="dialog" aria-label="Calculator">
  <h4>🧮 Calculator <button id="cX" type="button" aria-label="Închide">✕</button></h4>
  <input id="cIn" type="text" inputmode="decimal" placeholder="ex.: 4/30*100" autocomplete="off">
  <div id="cOut"></div>
  <div class="ck2"><button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button><button type="button" data-k="/">÷</button><button type="button" data-k="(">(</button>
  <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" data-k="*">×</button><button type="button" data-k=")">)</button>
  <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" data-k="-">−</button><button type="button" data-k="^">xʸ</button>
  <button type="button" data-k="0">0</button><button type="button" data-k=",">,</button><button type="button" data-k="√">√</button><button type="button" data-k="+">+</button><button type="button" id="cCopy" title="Copiază rezultatul">📋</button></div>
  <p class="small">Puteri: <code>^</code> (ex.: <code>(39/48)^(1/4)</code>). Radical: <code>√200</code>.</p>
</div>

/* ---------------- câmpurile ---------------- */
const FIELDS={};const SEC_FIELDS={};
function walkFields(sec){const out=[];const add=f=>{if(f&&f.in){FIELDS[f.in]=f;out.push(f);}};
  const scan=c=>{if(Array.isArray(c))c.forEach(scan);else if(c&&typeof c==='object'){if(c.in)add(c);else if(c.c)scan(c.c);}};
  sec.blocks.forEach(b=>{if(b.b==='p')scan(b.c);if(b.b==='tb')b.rows.forEach(r=>r.forEach(scan));if(b.b==='lines'){FIELDS[b.id]={in:b.id,k:'L'};out.push(FIELDS[b.id]);}
    if(b.b==='shot'){FIELDS[b.id]={in:b.id,k:'img'};out.push(FIELDS[b.id]);}if(b.b==='auto')b.rows.forEach((_,i)=>{const f={in:b.id+i,k:'auto'};FIELDS[f.in]=f;out.push(f);});
    if(b.b==='cover'){FIELDS.nume={in:'nume',k:'t'};out.push(FIELDS.nume);}});
  return out;}
SECTIONS.forEach(s=>SEC_FIELDS[s.id]=walkFields(s));
const filled=f=>f.k==='img'?IMG.has(f.in):String(A[f.in]==null?'':A[f.in]).trim()!=='';
function secProgress(id){const fs=SEC_FIELDS[id]||[];if(!fs.length)return null;return {d:fs.filter(filled).length,t:fs.length};}

/* ---------------- text cu **bold** și *cursiv* ---------------- */
function parseMk(s,base={}){const out=[];String(s).split(/(\*\*[^*]+\*\*|\*[^*]+\*|_\{[^}]+\})/).forEach(p=>{if(!p)return;if(/^\*\*[^*]+\*\*$/.test(p))out.push(...parseMk(p.slice(2,-2)).map(r=>Object.assign(r,{b:true})));else if(/^\*[^*]+\*$/.test(p))out.push(...parseMk(p.slice(1,-1)).map(r=>Object.assign(r,{i:true})));else if(/^_\{[^}]+\}$/.test(p))out.push({t:p.slice(2,-1),sub:true});else out.push({t:p});});return out;}
const mkHtml=s=>parseMk(s).map(r=>{let h=esc(r.t);if(r.sub)h=`<sub>${h}</sub>`;if(r.i)h=`<i>${h}</i>`;if(r.b)h=`<b>${h}</b>`;return h;}).join('').replace(/\n/g,'<br>');
const tallyStr=v=>{v=Math.max(0,Math.min(200,parseInt(v)||0));const g=[];for(let i=0;i<Math.floor(v/5);i++)g.push({five:true});if(v%5)g.push({rest:v%5});return g;};
const tallyHtml=v=>tallyStr(v).map(g=>g.five?'<span class="t5">||||</span>':'<span class="tr">'+'|'.repeat(g.rest)+'</span>').join(' ');

/* ---------------- valorile corecte și verificarea ---------------- */
function ansOf(f){try{return typeof f.a==='function'?f.a(A):f.a;}catch(e){return undefined;}}
function decs(s){const m=String(s).replace(/\s/g,'').match(/[.,](\d+)$/);return m?m[1].length:0;}
function isRight(f){const v=A[f.in];if(v==null||String(v).trim()==='')return null;
  if(f.chk)return !!f.chk(v);const a=ansOf(f);if(a==null||(typeof a==='number'&&isNaN(a)))return null;
  if(f.k==='s'||f.k==='yn')return String(v)===String(a);
  if(f.k==='n'){const x=num(v);if(isNaN(x))return false;const d=decs(v);let tol=f.tol||0.011;if(d===1)tol=Math.max(tol,0.051);if(f.tolRel)tol=Math.max(tol,Math.abs(a)*f.tolRel);return Math.abs(x-a)<=tol+1e-9;}

      const m=(a0+a1)/2,lx=cx+Math.cos(m)*(R*0.68),ly=cy+Math.sin(m)*(R*0.68);g.fillStyle='#fff';g.font=`bold 24px ${F}`;g.fillText(RO(v/tot*100,1)+'%',lx,ly+8);a0=a1;});
    g.textAlign='left';o.labels.forEach((l,i)=>{const y=200+i*58;g.fillStyle=XC[i%6];g.fillRect(740,y-16,20,20);g.fillStyle='#595959';g.font=`21px ${F}`;wrap(g,l,772,y,400,24);});return c.toDataURL('image/png');}

   <details class="bk"><summary>🔧 Probleme la trimitere?</summary><p>Dacă trimiterea nu merge, descarcă documentul Word (butonul de mai sus) și încarcă-l pe Classroom sau trimite-l profesorului. Mai jos poți verifica legătura cu Drive-ul profesorului.</p><button type="button" class="btn sm ghost" id="diagB">Verifică legătura</button><p id="diagM" class="small"></p></details></div>`);
  varBar(host.querySelector('.vslot'));
  host.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();go(b.dataset.go);});
  $('#fDl').onclick=()=>{if(!nameOk()||!varOk(()=>$('#fDl').click()))return;download(buildDocx(),fileName());};
  $('#fSend').onclick=sendDoc;
  $('#bkOut').onclick=()=>{const o={v:1,var:A.varianta||'',A,img:Object.fromEntries([...IMG])};download(new Blob([JSON.stringify(o)],{type:'application/json'}),`copie_caiet_${String(A.nume||'elev').replace(/\s+/g,'_')}.json`);};
  $('#bkIn').onclick=()=>$('#bkFile').click();
  $('#bkFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.A)throw 0;if(!confirm('Înlocuiești răspunsurile de pe acest dispozitiv cu cele din copie?'))return;
    A=o.A;if(!A.varianta&&(o.var==='PEO'||o.var==='STD'))A.varianta=o.var;LS.set(KEY,JSON.stringify(A));setVarUI();IMG.clear();for(const [k,v] of Object.entries(o.img||{})){IMG.set(k,v);await IDB.put(k,v);}alert('Copia a fost încărcată.');go('coperta');}catch(err){alert('Fișierul nu este o copie validă a caietului.');}};
  $('#diagB').onclick=diag;}
/* ---------------- varianta caietului: PEO sau fără PEO ---------------- */
const varName=()=>A.varianta==='PEO'?'PEO – cu antetul proiectului PEO':A.varianta==='STD'?'fără PEO – caietul obișnuit':'nealeasă';
function setVarUI(){const s=$('#varSub');if(s)s.textContent=A.varianta==='PEO'?'Varianta PEO':A.varianta==='STD'?'Varianta fără PEO':'Alege varianta caietului';}
function varBar(host){if(!host)return;const d=document.createElement('div');d.className='varbar'+(A.varianta?'':' none');
  d.innerHTML=`<span>Caietul tău: <b>${esc(varName())}</b></span><button type="button" class="btn sm ghost">${A.varianta?'Schimbă':'Alege acum'}</button>`;
  d.querySelector('button').onclick=()=>chooseVar();host.appendChild(d);}
function varOk(then){if(A.varianta)return true;chooseVar(then);return false;}
function chooseVar(then){let m=$('#varM');if(!m){m=document.createElement('div');m.id='varM';document.body.appendChild(m);}
  m.innerHTML=`<div class="vbox" role="dialog" aria-modal="true" aria-labelledby="varT"><h3 id="varT">Ești în proiectul PEO?</h3>
   <p>Alege cu atenție: de asta depinde cum arată caietul tău la final. Dacă nu știi sigur, întreabă profesorul.</p>
   <button type="button" class="vopt${A.varianta==='PEO'?' sel':''}" data-v="PEO"><b>Da, sunt în proiectul PEO</b><small>Caietul va avea antetul proiectului PEO pe fiecare pagină.</small></button>
   <button type="button" class="vopt${A.varianta==='STD'?' sel':''}" data-v="STD"><b>Nu, nu sunt în proiectul PEO</b><small>Caietul de practică obișnuit, fără antet.</small></button>
   ${A.varianta?'<button type="button" class="btn sm ghost" id="varX">Renunță</button>':''}<p class="small">Poți schimba alegerea oricând, de pe copertă. Răspunsurile tale rămân aceleași.</p></div>`;
  m.classList.add('on');
  m.querySelectorAll('.vopt').forEach(b=>b.onclick=()=>{A.varianta=b.dataset.v;save();m.classList.remove('on');setVarUI();render();nav();if(then)setTimeout(then,50);});
  const x=m.querySelector('#varX');if(x)x.onclick=()=>m.classList.remove('on');}
function nameOk(){if(String(A.nume||'').trim().split(/\s+/).length<2){alert('Scrie-ți mai întâi numele și prenumele pe copertă.');go('coperta');setTimeout(()=>{const i=$('[data-f="nume"]');if(i)i.focus();},100);return false;}return true;}
async function blobB64(blob){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.readAsDataURL(blob);});}
async function sendDoc(){if(!nameOk()||!varOk(sendDoc))return;const msg=$('#fMsg'),btn=$('#fSend');
  const p=SECTIONS.reduce((a,s)=>{const q=secProgress(s.id);if(q){a.d+=q.d;a.t+=q.t;}return a;},{d:0,t:0});
  if(p.d<p.t&&!confirm(`Ai completat ${p.d} din ${p.t} câmpuri. Trimiți caietul așa? (Poți trimite din nou mai târziu.)`))return;
  if(!online()){msg.innerHTML='⚠ Caietul nu e legat încă de Drive-ul profesorului. Am descărcat documentul Word: încarcă-l pe Classroom.';msg.className='fmsg ko';download(buildDocx(),fileName());return;}
  btn.disabled=true;btn.textContent='Se pregătește documentul…';msg.textContent='';
  try{const blob=buildDocx();const b64=await blobB64(blob);btn.textContent='Se trimite…';
    const body=JSON.stringify({a:'caiet',cheie:CFG.CHEIE,varianta:isPEO()?'PEO':'non-PEO',nume:A.nume,clasa:META.clasa,fisier:fileName(),date:b64,progres:`${p.d}/${p.t}`});
    let r=null;try{const res=await fetch(CFG.SERVER,{method:'POST',body,redirect:'follow'});r=await res.json();}catch(e){await fetch(CFG.SERVER,{method:'POST',body,mode:'no-cors'});r={ok:true,blind:true};}
    if(r&&r.ok){A._sent=new Date().toLocaleString('ro-RO');save();msg.innerHTML=`✔ Caietul a ajuns la profesor${r.blind?' (trimis; confirmarea nu a putut fi citită)':''}. Mai poți modifica și retrimite oricând.`;msg.className='fmsg ok';}
    else{msg.innerHTML=`⚠ Trimiterea nu a reușit (${esc(r&&r.err||'eroare')}). Am descărcat documentul Word: încarcă-l pe Classroom.`;msg.className='fmsg ko';download(blob,fileName());}}
  catch(e){msg.innerHTML='⚠ Nu m-am putut conecta. Verifică internetul și încearcă din nou; între timp am descărcat documentul Word.';msg.className='fmsg ko';try{download(buildDocx(),fileName());}catch(e2){}}
  btn.disabled=false;btn.textContent='📨 Trimite caietul profesorului';}
async function diag(){const m=$('#diagM');const S=String(CFG.SERVER||'').trim();
  if(!S){m.innerHTML='✘ În config.js, SERVER este gol (lipsește adresa care se termină cu /exec).';return;}
  if(/\/dev\/?$/.test(S)){m.innerHTML='✘ În config.js e adresa de test (/dev). Folosește adresa care se termină cu /exec.';return;}
  if(/docs\.google\.com/.test(S)){m.innerHTML='✘ În config.js e adresa unui document, nu a scriptului (trebuie să se termine cu /exec).';return;}
  m.textContent='Verific…';try{const r=await (await fetch(S)).json();m.innerHTML=r.ok?`✔ Scriptul răspunde (${esc(r.info||'')}). Folderul: ${esc(r.folder||'')}.`:'✘ Scriptul a răspuns cu o eroare: '+esc(r.err||'');}
  catch(e){m.innerHTML='✘ Scriptul nu răspunde. La implementare, „Cine are acces” trebuie să fie <b>Oricine</b>, iar adresa din config.js trebuie să fie cea de la „Gestionați implementările”.';}}

/* ---------------- pornire ---------------- */
async function start(){try{(await IDB.all()).forEach(([k,v])=>{if(v&&v.d)IMG.set(k,v);});}catch(e){}
  if(MIG){try{for(const [k,v] of await mkIDB(MIG).all()){if(v&&v.d&&!IMG.has(k)){IMG.set(k,v);await IDB.put(k,v);}}}catch(e){}}
  // dimensiunile imaginilor (pentru Word)
  IMG.forEach((v,k)=>{const im=new Image();im.onload=()=>{v.w=im.width;v.h=im.height;};im.src=v.d;});
  const h=(location.hash||'').slice(1);if(SECTIONS.find(s=>s.id===h))CUR=h;
  $('#menuB').onclick=()=>document.body.classList.toggle('navon');$('#calcB').onclick=()=>openCalc();
  $('#cIn').oninput=calcRun;$('#cX').onclick=()=>$('#calc').classList.remove('on');$('#cCopy').onclick=()=>{const v=$('#cOut').dataset.v;if(v){try{navigator.clipboard.writeText(String(v).replace('.',','));}catch(e){}}};
  $$('#calc [data-k]').forEach(b=>b.onclick=()=>{const i=$('#cIn');i.value+=b.dataset.k;calcRun();i.focus();});
  $('#sendB').onclick=()=>go('final');
  document.addEventListener('click',e=>{const a=e.target.closest('a[data-go]');if(a){e.preventDefault();go(a.dataset.go);}});
  render();nav();setVarUI();if(!A.varianta)chooseVar();}
const _origSet=IMG.set.bind(IMG);IMG.set=(k,v)=>{if(v&&v.d&&!v.w){const im=new Image();im.onload=()=>{v.w=im.width;v.h=im.height;};im.src=v.d;}return _origSet(k,v);};
start();
window.__T={A:()=>A,FIELDS,SECTIONS,buildDocx,ansOf,isRight,IMG,GEN,setA:(k,v)=>{A[k]=v;},save};

</script>
